<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a8c4b'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='800' font-size='36' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zen Bottling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control-room cockpit — inputs rail on the left, live P&L and economics tabs on the right; one location per tab in the header. */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --surface2:#e9ede9; --fg:#15201a; --muted:#5d6a63; --line:#d3dad4; --line2:#bfc8c1;
  --accent:#1a8c4b; --accent-ink:#0e5a30; --accent-soft:#e2f3e8;
  --good:#1a8c4b; --warn:#b8720c; --bad:#bb3a2c; --warn-soft:#fbefd9; --bad-soft:#f9e3df; --good-soft:#e2f3e8;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#171e1a; --surface2:#1f2823; --fg:#e4eae6; --muted:#97a39c; --line:#2a342e; --line2:#3a463f;
  --accent:#3fbf7a; --accent-ink:#8fe0b4; --accent-soft:#17382a;
  --good:#3fbf7a; --warn:#e0a03a; --bad:#e3685a; --warn-soft:#3a2c12; --bad-soft:#3d1c18; --good-soft:#17382a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#171e1a; --surface2:#1f2823; --fg:#e4eae6; --muted:#97a39c; --line:#2a342e; --line2:#3a463f;
  --accent:#3fbf7a; --accent-ink:#8fe0b4; --accent-soft:#17382a;
  --good:#3fbf7a; --warn:#e0a03a; --bad:#e3685a; --warn-soft:#3a2c12; --bad-soft:#3d1c18; --good-soft:#17382a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:5px 7px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-size:13px;text-align:right}
input:disabled{opacity:.5}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15px}
.brand .co{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em}
.brand .doc{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tool-name{font-family:var(--display);font-weight:600;font-size:17px}
.scen{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:6px;margin-left:auto;flex-wrap:wrap}
.scen button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:4px;font-weight:600;font-size:13px}
.scen button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.mods{display:flex;gap:2px;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.mods button{border:0;background:var(--surface);color:var(--muted);padding:6px 12px;font-weight:700;font-size:13px}
.mods button.on{background:var(--accent);color:#fff}
textarea.ta{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:6px;width:100%;min-height:64px;resize:vertical}
.pack{display:flex;flex-direction:column;gap:22px}
.lock{max-width:460px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock input{max-width:280px;text-align:center;font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:var(--surface2);color:var(--fg);border-radius:14px;padding:4px 11px;font-size:12.5px}
.ask-in{display:flex;gap:8px;align-items:flex-start}
.ask-in textarea{flex:1;min-height:56px}
.answer{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.answer .q{font-family:var(--display);font-weight:600}
.answer .a{white-space:pre-wrap;line-height:1.5}
.answer table{font-size:13px}
.pack section{break-inside:avoid}
.pack h2{font-size:18px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.cover{padding:26px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.cover .code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em}
.cover .sub{color:var(--muted);font-size:15px;margin-top:4px}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:110%;background:var(--surface);border:1px solid var(--line2);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;min-width:230px;z-index:20;padding:4px}
.menu .dd button{border:0;background:transparent;color:var(--fg);text-align:left;padding:8px 10px;border-radius:4px;font-size:13px}
.menu .dd button:hover{background:var(--surface2)}
.menu .dd .hint{padding:4px 10px 6px}
@media print{ .top,.rail,.tabs,.alerts,.kpis,.foot,.tools{display:none!important} .wrap{display:block;padding:0} .panel{border:0;padding:0} body{background:#fff;color:#000} }
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--fg);padding:6px 11px;border-radius:5px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}

.wrap{display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1700px;margin:0 auto}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .sum{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;text-align:right}
.sec-body{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.frow{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center}
.frow label{font-size:13px}
.frow .u{font-size:11px;color:var(--muted);margin-left:4px}
.grp{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}

.card{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.card .hd{display:flex;align-items:center;gap:8px}
.card .hd input[type=text]{font-weight:700;flex:1}
.card .hd .tog{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.card .hd .tog input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fld{display:flex;flex-direction:column;gap:2px}
.fld span{font-size:11px;color:var(--muted);letter-spacing:.02em}
.card .out{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:4px;border-top:1px dashed var(--line2)}
.card .out b{color:var(--fg);font-family:var(--mono);font-weight:600}
.est{font-size:10px;font-family:var(--display);font-weight:700;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);padding:1px 5px;border-radius:3px}
.svc{display:grid;grid-template-columns:1fr 92px 86px 56px;gap:6px;align-items:center}
.svc input[type=text]{font-size:13px}
.svcard{background:var(--surface);gap:6px}
.svcard input[type=text]{font-size:13px}
.svcrow{display:grid;grid-template-columns:1.2fr 1fr .9fr .8fr auto;gap:6px;align-items:end}
.svcmo{padding:6px 0;font-weight:600;font-size:13px;white-space:nowrap}
@media (max-width:520px){.svcrow{grid-template-columns:1fr 1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--line2)}
.kpi.good{border-top-color:var(--good)} .kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--bad)}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--display)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .v.neg{color:var(--bad)}

.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-radius:6px;padding:9px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.good{background:var(--good-soft);border-color:var(--good)}
.alert .tag{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--surface);white-space:nowrap}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 14px;font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1200px){.two{grid-template-columns:1fr}}
.two>div{min-width:0}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2)}
td:first-child,th:first-child{text-align:left;white-space:normal}
td.n{font-family:var(--mono);font-size:12.5px}
tr.sub td{color:var(--muted)}
tr.tot td{font-weight:700;border-top:2px solid var(--line2);background:var(--surface2)}
tr.tot td.n{font-weight:600}
td.neg{color:var(--bad)} td.pos{color:var(--good)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;font-family:var(--display)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--bad)}

.chart{position:relative;height:260px}
.chart canvas{max-width:100%}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line2);padding:6px 10px}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);max-width:1700px;margin:0 auto}
.foot b{color:var(--fg)}
dialog{border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);max-width:min(760px,94vw);width:100%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px}
.dlg textarea{width:100%;min-height:260px;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <div class="brand"><div class="mark" id="brandMark">·</div><div><input type="text" id="hdrCompany" class="co" placeholder="Company name" aria-label="Company name" style="border:1px dashed var(--line2);background:transparent;padding:2px 6px;width:300px;max-width:60vw"><div class="doc">ZEN-FIN-001 · Zen Bottling — Plant Economics, Valuation &amp; Data Room</div></div></div>
  <div class="mods" id="mods"><button data-m="econ">Plant Economics</button><button data-m="val">Valuation &amp; QoE</button><button data-m="dr">Data Room</button><button data-m="act">Actuals 2026</button><button data-m="ask">Assistant</button></div>
  <button class="btn" id="btnLock" hidden title="Lock the valuation and data-room modules">🔒 Lock admin</button>
  <div class="scen" id="scenTabs"></div>
  <div class="tools">
    <button class="btn" id="btnCompare">Compare locations</button>
    <div class="menu"><button class="btn primary" id="btnExportMenu">Export ▾</button><div class="dd" id="exportDD" hidden>
      <button data-x="xlsx">Excel workbook (.xlsx) — all tables</button>
      <button data-x="pdf">PDF report pack (.pdf)</button>
      <button data-x="pdfpl">PDF — P&amp;L only</button>
      <button data-x="csvcust">CSV — customer list</button>
      <button data-x="csvpl">CSV — P&amp;L</button>
      <button data-x="json">JSON — location data (backup)</button>
      <div class="hint" id="dlHint">Files download to your device.</div>
    </div></div>
    <button class="btn" id="btnImport">Upload / Import</button>
    <button class="btn danger" id="btnReset">Reset data</button>
  </div>
</div></header>

<div class="wrap">
<aside class="rail" id="rail"></aside>
<main class="main">
  <div class="kpis" id="kpis"></div>
  <div class="alerts" id="alerts"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
</div>

<footer class="foot">
  <div><b id="footCompany"></b> · Zen Bottling plan · Plant Economics · Valuation · Data Room · <span class="est">EST</span> marks a value that was estimated and must be verified against the books</div>
  <div>Powered by <b>ZoeAI</b></div>
</footer>

<dialog id="dlg"><div class="dlg">
  <h2 id="dlgTitle" style="font-size:16px">Import location</h2>
  <p class="hint" id="dlgHint"></p>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <input type="file" id="dlgFile" accept=".json,.csv,.xlsx,.xls,.txt">
  <div id="dlgPreview" hidden></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
    <button class="btn" id="dlgCopy">Copy to clipboard</button>
    <button class="btn" id="dlgClose">Close</button>
    <button class="btn" id="dlgApplyNew">Add as new location</button>
    <button class="btn primary" id="dlgApply">Replace current location</button>
  </div>
</div></dialog>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
/* ===================== DATA MODEL v2 =====================
 location = { name, company, site, f (facility fixed + parameters), services[], depts[], lines[], skus[], growth }
 Revenue is derived from SKUs: units = demand (or hours × effective BPM), capped by the line's available run-minutes.
*/
const FACILITY_FIELDS = [
  ['grp','Building'],
  ['sqft','Facility size','sq ft',1],
  ['rentPsf','Base rent','$/sq ft/mo',0.01],
  ['cam','CAM / NNN / property tax','$/mo',1],
  ['insurance','Insurance (property, GL, product recall)','$/mo',1],
  ['grp','Utilities — fixed portion (base load; per-unit utilities live on each SKU)'],
  ['power','Electricity','$/mo',1],
  ['water','Water + sewer + industrial discharge fees','$/mo',1],
  ['gas','Natural gas / propane','$/mo',1],
  ['waste','Trash, recycling, cardboard hauling','$/mo',1],
  ['grp','Equipment & capital'],
  ['maintParts','Maintenance parts & consumables (in-house)','$/mo',1],
  ['equipLease','Equipment leases','$/mo',1],
  ['interest','Debt interest','$/mo',1],
  ['depreciation','Depreciation (non-cash)','$/mo',1],
  ['grp','G&A'],
  ['itSoft','IT, software, ERP, cameras','$/mo',1],
  ['legal','Legal','$/mo',1],
  ['office','Office, phones, internet, supplies','$/mo',1],
  ['marketing','Sales & marketing spend','$/mo',1],
  ['misc','Misc / contingency','$/mo',1],
  ['grp','Plant parameters'],
  ['days','Production days / month','days',1],
  ['maxCrews','Crews available (hard constraint)','crews',1],
  ['payrollTax','Payroll taxes (FICA, FUTA, SUTA)','%',0.1],
  ['workersComp','Workers comp','% of wages',0.1],
  ['benefits','Benefits per head','$/mo',1],
  ['taxRate','Income tax rate','%',1],
  ['cash','Cash on hand','$',1000],
];
const FREQ = {weekly:52/12, monthly:1, quarterly:1/3, semiannual:1/6, annual:1/12};
const CONTAINERS=['Glass','PET','Can','Aluminum bottle','Bag-in-box','Other'];

function rosevilleLocation(){
  // Seeded from the QoE/valuation workbook (transaction v17): overhead stack, 49-person roster, customer book, storage, add-backs, deal terms. EST = estimate, verify.
  return {
    name:'Roseville, CA', company:'Tradition Beverages LLC · DBA Well Above Bottling & Canning',
    site:{address:'8250 Industrial Ave, Roseville, CA 95678 · 135,000 sq ft · SQF Site #91067 · 7 lines, 4 crews · no alcohol'},
    f:{ sqft:135000, rentPsf:1.00, cam:0, insurance:9000, power:50000, water:0, gas:0, waste:0,
        maintParts:20000, equipLease:0, interest:0, depreciation:40000,
        itSoft:3500, legal:2500, office:2500, marketing:0, misc:0,
        days:22, maxCrews:4, payrollTax:12.2, workersComp:0, benefits:0, taxRate:21, cash:0 },
    est:{insurance:1,depreciation:1,itSoft:1,legal:1,office:1,cash:1},
    services:[
      {name:'Paid training & onboarding time (+30 min/day)', vendor:'', freq:'monthly', cost:4426},
      {name:'Pest control (SQF program)', vendor:'', freq:'monthly', cost:450, est:1},
      {name:'RO / water-treatment service & membranes', vendor:'', freq:'monthly', cost:2500, est:1},

const lineOut=L=>`<span>Avail run-hrs <b>${fmtN(L.availMin/60)}</b></span><span>Booked <b>${fmtN(L.usedMin/60)} h</b></span><span>Units <b>${fmtM(L.units)}</b></span><span>Labor <b>${fmtK(L.labor)}</b></span>${L.overbooked?'<span class="est" style="color:var(--bad);background:var(--bad-soft)">OVERBOOKED</span>':''}`;
const skuOut=sk=>!sk.ok?'<span>Line is off — no production</span>':`<span>Units <b>${fmtM(sk.units)}</b></span><span>Line hrs <b>${fmtN(sk.min/60)}</b></span><span>Revenue <b>${fmtK(sk.revenue)}</b></span><span>Full cost <b>${cents(sk.fullCost)}</b></span>${sk.capped?'<span class="est" style="color:var(--bad);background:var(--bad-soft)">CAPPED</span>':''}`;
const deptOut=d=>`<span>Loaded <b>${fmt$(d.total)}/mo</b></span><span>Per head <b>${fmt$(d.total/Math.max(1,d.heads))}</b></span>${d.isAgency?'<span>agency</span>':''}`;
function onInput(e){
  const s=S(); const id=e.target.id; if(!id) return;
  const v=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?(e.target.value===''?0:parseFloat(e.target.value)):e.target.value;
  let m;
  if((m=id.match(/^f-(\w+)$/))){ s.f[m[1]]=v; if(s.est) delete s.est[m[1]]; }
  else if((m=id.match(/^lp-(\d+)-(\d+)-(\w+)$/))) s.lines[+m[1]].roster[+m[2]][m[3]]=v;
  else if((m=id.match(/^l-(\d+)-shift2$/))) s.lines[+m[1]].shifts = v?2:1;
  else if((m=id.match(/^l-(\d+)-(\w+)$/))) s.lines[+m[1]][m[2]]=v;
  else if((m=id.match(/^k-(\d+)-mat-(\w+)$/))) s.skus[+m[1]].mat[m[2]]=v;
  else if((m=id.match(/^k-(\d+)-(\w+)$/))) s.skus[+m[1]][m[2]]= m[2]==='line'? parseInt(v,10) : v;
  else if((m=id.match(/^d-(\d+)-(\w+)$/))) s.depts[+m[1]][m[2]]=v;
  else if((m=id.match(/^v-(\d+)-(\w+)$/))) s.services[+m[1]][m[2]]=v;
  else if((m=id.match(/^g-(\w+)$/))) s.growth[m[1]]=v;
  else if((m=id.match(/^st-(\d+)-(\w+)$/))) s.storage[+m[1]][m[2]]=v;
  else if((m=id.match(/^ab-(\d+)-(\w+)$/))){ s.val.addbacks[+m[1]][m[2]]=v; if(m[2]==='amt') delete s.val.addbacks[+m[1]].est; }
  else if((m=id.match(/^ln-(\d+)-(\w+)$/))) s.val.loans[+m[1]][m[2]]=v;
  else if((m=id.match(/^va-(\w+)$/))) s.val[m[1]]=v;
  else if((m=id.match(/^pp-(\d+)-(\w+)$/))) s.pipeline[+m[1]][m[2]]=v;
  else if((m=id.match(/^cx-(\d+)-(\w+)$/))) s.capex[+m[1]][m[2]]=v;
  else if((m=id.match(/^rk-(\d+)-(\w+)$/))) s.dr.risks[+m[1]][m[2]]=v;
  else if((m=id.match(/^dc-(\d+)-(\d)$/))) s.dr.docs[+m[1]][+m[2]]=v;
  else if((m=id.match(/^dr-(\w+)$/))) s.dr[m[1]]=v;
  else if(id==='s-name') s.name=v; else if(id==='s-company') s.company=v; else if(id==='s-address') s.site.address=v;
  save(); renderMain(); if(state.module==='econ') updateRailOutputs(); renderBrand();
}
function onChange(e){ const id=e.target.id||''; if(e.target.tagName==='SELECT'||e.target.type==='checkbox'||id==='s-name'){ onInput(e); rerender(true); } }
function updateRailOutputs(){
  const s=S(); const r=calc(s);
  r.lines.forEach((L,i)=>{const c=$('#lout-'+i); if(c) c.innerHTML=lineOut(L);});
  r.skus.forEach((k,i)=>{const c=$('#kout-'+i); if(c) c.innerHTML=skuOut(k);});
  r.depts.forEach((d,i)=>{const c=$('#dout-'+i); if(c) c.innerHTML=deptOut(d);});
  const sums=$('#rail').querySelectorAll('summary .sum'); if(sums.length>=7){ sums[1].textContent=fmtK(r.facilityFixed)+'/mo'; sums[2].textContent=fmtK(r.servicesTotal)+'/mo'; sums[3].textContent=`${s.lines.filter(l=>l.active).length} running · ${r.directHeads} heads · ${fmtK(r.directLabor)}`; sums[4].textContent=`${s.skus.length} SKUs · ${fmtK(r.revenue)}`; sums[5].textContent=`${r.indirectHeads} heads · ${fmtK(r.indirectLabor)}/mo`; }
}

function renderMain(){
  const s=S(); const r=calc(s);
  const k=[
    ['Revenue / mo',fmtK(r.revenue),fmtM(r.units)+' units · '+r.customers.length+' customers'+(r.materials?' · net of materials '+fmtK(r.netRevenue):''),''],
    ['Contribution',fmtK(r.contribution),pct(r.revenue?r.contribution/r.revenue:0)+' · '+cents(r.cmUnit)+'/unit after direct labor',r.contribution>0?'good':'bad'],
    ['Fixed overhead',fmtK(r.fixedCash),fmtK(r.facilityFixed)+' facility · '+fmtK(r.servicesTotal)+' services · '+fmtK(r.indirectLabor)+' indirect',''],
    ['EBITDA / mo',fmtK(r.ebitda),pct(r.ebitdaMargin)+' margin · '+fmtK(r.perDay)+'/day',r.ebitda>0?'good':'bad'],
    ['Net income / mo',fmtK(r.net),'after D&A '+fmtK(r.f.depreciation)+', interest, tax',r.net>0?'good':r.net>-r.f.depreciation?'warn':'bad'],
    ['Breakeven volume',fmtM(r.beUnits),isFinite(r.beUnits)?(r.units>=r.beUnits?'covered by '+pct(r.units/r.beUnits-1):'short by '+fmtM(r.beUnits-r.units)):'contribution ≤ 0',r.units>=r.beUnits?'good':'bad'],
    ['Line time producing',pct(r.prodUtil),fmtN(r.idleMin/60)+' idle clocked hrs · '+fmtK(r.idleCost)+' idle cost',r.prodUtil>0.7?'good':r.prodUtil>0.5?'warn':'bad'],
    ['Headcount',r.totalHeads,`${r.directHeads} line · ${r.indirectHeads} indirect · ${pct(r.laborPct)} of revenue`,''],
  ];
  $('#kpis').innerHTML=k.map(x=>`<div class="kpi ${x[3]}"><div class="l">${x[0]}</div><div class="v ${/^-/.test(x[1])?'neg':''}">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('');
  const al=[];
  if(!s.lines.length&&!s.skus.length) al.push(['warn','Empty','This location has no lines or customers yet. Use <b>Upload / Import</b> (JSON export, or a CSV / Excel of costs, customers, lines and headcount — the app classifies the rows) or add items in the left rail.']);
  if(r.maxConcurrent>r.f.maxCrews) al.push(['bad','Crews',`${r.maxConcurrent} lines are scheduled in the same shift but only ${r.f.maxCrews} crews exist. The volume shown cannot be produced. Turn a line off, run it on a second shift, or add a crew (and its labor).`]);
  r.lines.filter(L=>L.overbooked).forEach(L=>al.push(['bad','Capacity',`${L.name}: customers need ${fmtN(L.demandMin/60)} run-hrs/mo but the line has ${fmtN(L.availMin/60)} at OEE ${L.oee}%. SKUs capped to ${pct(L.scale)} of demand (${fmtK((1-L.scale)*L.skus.reduce((a,x)=>a+x.demandUnits*x.fee,0))} revenue not producible). Add a shift, raise OEE, or move a SKU.`]));
  if(r.ebitda<0) al.push(['bad','Bleed',`Plant loses ${fmtK(-r.ebitda)}/mo in cash (${fmtK(-r.perDay)}/production day). Cash ${fmtK(r.f.cash)} lasts ~${(r.f.cash/Math.max(1,-r.cashFlow)).toFixed(1)} months.`]);
  else if(r.net<0) al.push(['warn','Thin',`EBITDA positive, but depreciation + interest (${fmtK(r.f.depreciation+r.f.interest)}/mo) are not covered — equipment is being consumed faster than it is paid for.`]);

  r.customers.filter(c=>c.share>0.5).forEach(c=>al.push(['warn','Concentration',`${c.customer} is ${pct(c.share)} of revenue. Losing or re-pricing this account alone decides whether the plant is profitable.`]));

/* ===================== RUN-TIME PLAN (lean: hours vs output, OT, days to complete) ===================== */
function crewHourly(l,f){ const loaded=1+f.payrollTax/100+f.workersComp/100; const ros=(l.roster&&l.roster.length)?l.roster:null; const base = ros? ros.reduce((a,x)=>a+(+x.heads||0)*(+x.rate||0),0) : l.crew*l.wage; return base*loaded; }
function runPlan(s,r,o){
  o=o||{}; const f=s.f; const days=o.days||f.days; const maxOT=o.maxOT==null?2:o.maxOT; const payBasis=o.payBasis||'month';
  const lines=r.lines.filter(l=>l.active).map(L=>{
    const skus=L.skus.map(k=>({customer:k.customer,sku:k.sku,units:k.demandUnits,hours:L.effBpm>0?k.demandUnits/(L.effBpm*60):0}));
    const unitsReq=skus.reduce((a,k)=>a+k.units,0); const runHrs=skus.reduce((a,k)=>a+k.hours,0); const totalHrs=runHrs+L.changeHrs;
    const ch=crewHourly(L,f); const heads=L.crew; const shiftHrs=L.hrs;
    const straightCap=days*shiftHrs; const daysStraight=totalHrs/shiftHrs;
    let mode, otHrsPerDay=0, otHrs=0, straightHrs=Math.min(totalHrs,straightCap), daysUsed=Math.min(days,Math.ceil(daysStraight));
    if(totalHrs<=straightCap){ mode='straight'; }
    else { otHrs=totalHrs-straightCap; otHrsPerDay=otHrs/days; if(otHrsPerDay<=maxOT){ mode='ot'; daysUsed=days; } else { mode='second-shift'; } }
    const laborRun = straightHrs*ch + otHrs*ch*1.5;                 // labor for the work itself
    const laborMonth = payBasis==='month' ? days*shiftHrs*ch + (mode==='ot'?otHrs*ch*1.5:0) : laborRun; // full-month payroll vs pay for days worked
    const idleHrs = Math.max(0, straightCap-totalHrs);
    const takt = unitsReq>0 ? (days*shiftHrs*3600)/unitsReq : 0; const cycle = L.effBpm>0? 60/L.effBpm : 0;
    const weeks = daysUsed/5;
    const secondShiftDays = mode==='second-shift' ? Math.ceil(totalHrs/(2*shiftHrs)) : 0;
    return {L,skus,unitsReq,runHrs,totalHrs,ch,heads,shiftHrs,straightCap,daysStraight,daysUsed,weeks,mode,otHrs,otHrsPerDay,laborRun,laborMonth,idleHrs,idleCost: idleHrs*ch,takt,cycle,secondShiftDays,laborPerUnitRun: unitsReq? laborRun/unitsReq:0, laborPerUnitMonth: unitsReq? laborMonth/unitsReq:0};
  });
  return {days,maxOT,payBasis,lines, totals:{units:lines.reduce((a,x)=>a+x.unitsReq,0),hours:lines.reduce((a,x)=>a+x.totalHrs,0),laborRun:lines.reduce((a,x)=>a+x.laborRun,0),laborMonth:lines.reduce((a,x)=>a+x.laborMonth,0),idleCost:lines.reduce((a,x)=>a+x.idleCost,0)}};
}

function leanCover(s){
  s.lean=s.lean||{}; const cov=s.lean.cover||(s.lean.cover={});
  const rows=(s.depts||[]).map((d,i)=>{ if(cov[i]==null) cov[i]=!/sqf|quality|qa\b|operations manager|ops manager|owner/i.test(d.name); return {i,name:d.name,heads:d.heads,on:!!cov[i]}; });

  return {rows,heads,names:rows.filter(x=>x.on).map(x=>x.name.split(/ \(| — | with /)[0])};
}
function leanHourlyKept(s,r){ const cov=leanCover(s); const crew=r.lines.filter(l=>l.active).reduce((a,l)=>a+l.crew,0); return Math.max(0,crew-cov.heads); }

function defaultRamp(s,r){ const booked=r.units||1100000; return {start:'2027-02',months:12,pre:1,leanMonths:3,afterMode:'full',maxOT:1,target:4000000,vols:[500000,1000000,1500000,2000000,2000000,2500000,3000000,3500000,3500000,3500000,3500000,3500000],vols2:[0,0,500000,500000,500000,500000,500000,500000,500000,500000,500000,500000],fee2:0.12,reliefMonths:6,reliefPct:50,ohCut:0}; }

function rampPlan(s,r,g){
  const f=s.f; const lines=r.lines.filter(l=>l.active); const L=lines[0]; if(!L) return null; const d=s.deal||(s.deal=defaultDeal());
  const uph=L.effBpm*60; const shiftHrs=L.hrs; const days=f.days; const chFull=crewHourly(L,f); const ros=(L.roster&&L.roster.length)?L.roster:null; const avgRate=ros&&L.crew?ros.reduce((a,x)=>a+(+x.heads||0)*(+x.rate||0),0)/L.crew:L.wage;
  const kept=leanHourlyKept(s,r); const chLean=kept*avgRate*r.loaded; const OHfull=r.fixedCash; const rent=r.rent; const feeU=r.units?r.revenue/r.units:(s.skus[0]?s.skus[0].fee:0); const varU=r.units?r.variable/r.units:(s.skus[0]?s.skus[0].varu:0); const fee2=+g.fee2||0;
  const capexCash=(d.install||[]).filter(x=>(x.by||'Zen')==='Zen').reduce((a,x)=>a+(+x.cost||0),0); const capexAll=(d.install||[]).reduce((a,x)=>a+(+x.cost||0),0); const assets=(d.assets||[]).reduce((a,x)=>a+(+x.value||0),0);
  const out=[]; let cum=-capexCash; let relief=0; const reliefM=+g.reliefMonths||0, reliefPct=(+g.reliefPct||0)/100, ohCut=+g.ohCut||0;

function plRows(s,r,vr){

  push('Contracted services & programs',-r.servicesTotal,'sub'); r.fixedItems.forEach(x=>push(x[0],-x[1],'sub')); push('Facility, services & fixed overhead',-(r.facilityFixed+r.servicesTotal),'tot');

}

function applyClassified(asNew){

    if(x.cat==='skip'||x.cat==='misc'&&!x.amt) return; n++;

d $${Math.round(A.mrhTotal).toLocaleString()} booked as capex, of which ~$${Math.round(A.mrhFee).toLocaleString()} is his $12K/mo consulting fee and the rest is equipment Tradition bought from him. The P&L reclasses all three fees to owner compensation (COGS, gross margin and opex are restated; MRH equipment stays capex). In the QoE the fees are the owner-comp add-back. Split each company's invoices into draw / reimbursed expenses / capex. Greg also carries $226K of shareholder loans (2900).`],['Med','Materials mapping defaults',`${A.defaultCount} vendor assignments are my defaults from your rules; ${A.unmappedCount} are unassigned. Confirm in the rail.`],['Low','Suspense & Amazon','$29K unidentified (9999) and $30K Amazon purchases pending itemization.'],['Low','Kroger price build','Model assumes $0.7216 delivered / $0.18 fee+markup. Cash shows ${fmtK(A.prof[0]?A.prof[0].direct:0)} materials on ${fmtK(A.prof[0]?A.prof[0].gross:0)} gross — validate the price build against actual landed cost per bottle.']];
  v.innerHTML=`<div class="panel"><h2>Flags &amp; gaps before this is lender- or buyer-grade</h2><div class="tw"><table><tr><th>Priority</th><th>Item</th><th>What it means / action</th></tr>${flags.map(f=>`<tr><td><span class="pill ${f[0]==='High'?'bad':f[0]==='Med'?'warn':'good'}">${f[0]}</span></td><td><b>${esc(f[1])}</b></td><td style="text-align:left;white-space:normal">${f[2]}</td></tr>`).join('')}</table></div>
  <h3>Forecast model vs actuals — the reconciliation you asked for</h3><div class="tw"><table><tr><th>Item</th><th>Forecast model (run-rate / mo)</th><th>Actuals (this entity, avg active mo)</th><th>Read</th></tr>
   <tr><td>Kroger gross</td><td class="n">${fmtK(calc(s).customers.find(c=>c.customer==='Kroger')?.revenue||0)}</td><td class="n">${fmtK((A.customers.find(c=>c.cust==='Kroger')||{gross:0}).gross/7)}</td><td class="hint" style="text-align:left">Mar–Sep deposits ÷ 7; Oct factored</td></tr>
   <tr><td>Tolling fee revenue (Waiakea, Voss, Cirkul, other)</td><td class="n">${fmtK(calc(s).customers.filter(c=>!/kroger|novamex|tahoe/i.test(c.customer)).reduce((a,c)=>a+c.revenue,0))}</td><td class="n">${fmtK(A.customers.filter(c=>!c.isTurnkey&&!/tipp|tahoe/i.test(c.cust)).reduce((a,c)=>a+c.gross,0)/A.activeMonths)}</td><td class="hint" style="text-align:left">Lumpy — large single payments</td></tr>
   <tr><td>Materials & freight</td><td class="n">${fmtK(calc(s).materials)}</td><td class="n">${fmtK(A.cogsTotal/A.activeMonths)}</td><td class="hint" style="text-align:left">Actual COGS includes Tipp/Tehuacán and Jarritos PET purchases</td></tr>
   <tr><td>Payroll (all)</td><td class="n">${fmtK(calc(s).directLabor+calc(s).indirectLabor)}</td><td class="n">${fmtK(A.opexGroups.find(g=>/Payroll/.test(g.name))?.m.reduce((a,b)=>a-b,0)/5||0)}</td><td class="hint" style="text-align:left">Entity paid payroll only Jun–Oct; rest in Well Above</td></tr>
   <tr><td>Utilities</td><td class="n">${fmtK(s.f.power+s.f.water+s.f.gas+s.f.waste)}</td><td class="n">${fmtK(186792/8)}</td><td class="hint" style="text-align:left">City of Roseville ≈ $23K/mo actual vs $50K modeled (model lumps consumables/glue/pallets)</td></tr>
   <tr><td>R&M (ex Z&O owner comp)</td><td class="n">${fmtK(s.f.maintParts)}</td><td class="n">${fmtK((273298+195762+48568-A.zoTotal)/A.activeMonths)}</td><td class="hint" style="text-align:left">Actual R&M ≈ $${Math.round((273298+195762+48568-A.zoTotal)/A.activeMonths/1000)}K/mo vs $20K modeled — the glass-line speed problem in dollars</td></tr>
  </table></div></div>`;
}
function renderRailActuals(rail,s){
  const A=actualize(s);
  let body='';
  if(!A){ body=`<p class="hint">No ledger for this location. Upload a classified bank ledger: Excel/CSV with columns <b>Date, Acct, Account Name, Amount (+in/−out), Partner</b> and optionally Type.</p><input type="file" id="ledgerFile" accept=".xlsx,.xls,.csv">`; }
  else {
    const groups={}; A.cogsParts.forEach(x=>{ (groups[x.acct]=groups[x.acct]||[]).push(x); });
    body=`<div class="grp">Kroger price build</div><div class="frow"><label>Delivered price<span class="u">$/bottle</span></label>${numIn('kro-price',s.kro.price,0.001)}</div><div class="frow"><label>Fee + markup kept<span class="u">$/bottle</span></label>${numIn('kro-fee',s.kro.fee,0.005)}</div>
    <div class="grp">Vendor → customer mapping</div><p class="hint">Assign every vendor. "Shared" is allocated to all customers by revenue share.</p>`+
    Object.keys(groups).sort().map(acct=>`<div class="grp">${acct} ${esc((A.L.accounts.find(a=>a.acct===acct)||{name:''}).name.replace('COGS - ',''))}</div>`+groups[acct].sort((a,b)=>b.amount-a.amount).map(x=>{ const key=x.acct+'|'+x.partner; return `<div class="card" style="padding:7px"><div style="display:flex;justify-content:space-between;gap:6px"><b style="font-size:12.5px">${esc(x.partner)}</b><span class="num hint">${fmtK(x.amount)}</span></div><div class="g2"><select data-map="${esc(key)}" data-f="cust">${CUSTS.map(c=>`<option ${x.cust===c?'selected':''}>${c}</option>`).join('')}</select><select data-map="${esc(key)}" data-f="type">${MATTYPES.map(c=>`<option ${x.type===c?'selected':''}>${c}</option>`).join('')}</select></div></div>`; }).join('')).join('')+`<button class="btn" id="resetMap">Reset mapping to defaults</button>`;
  }
  rail.innerHTML=`<details class="sec" open><summary>Actuals 2026 — ${esc(s.name)}</summary><div class="sec-body">${body}</div></details>`;
  rail.querySelectorAll('[data-map]').forEach(sel=>sel.onchange=()=>{ const k=sel.dataset.map; s.matmap[k]=s.matmap[k]||{}; s.matmap[k][sel.dataset.f]=sel.value; const cur=A.cogsParts.find(x=>x.acct+'|'+x.partner===k); if(cur){ if(!s.matmap[k].cust) s.matmap[k].cust=cur.cust; if(!s.matmap[k].type) s.matmap[k].type=cur.type; } save(); renderMain(); });
  const kp=$('#kro-price'), kf=$('#kro-fee'); if(kp){ kp.oninput=()=>{s.kro.price=+kp.value||0.7216;save();renderMain();}; kf.oninput=()=>{s.kro.fee=+kf.value||0.18;save();renderMain();}; }
  const rm=$('#resetMap'); if(rm) rm.onclick=()=>{ s.matmap={}; save(); rerender(true); };
  const lf=$('#ledgerFile'); if(lf) lf.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ s.ledger=parseLedger(rd.result); save(); rerender(true); toast('Ledger loaded'); }catch(err){ toast('Could not read ledger: '+err.message); } }; rd.readAsArrayBuffer(f); };
}
function parseLedger(buf){
  const wb=XLSX.read(buf,{type:'array'}); let best=null;
  wb.SheetNames.forEach(sn=>{ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}); const hi=aoa.findIndex(r=>r.some(c=>/^acct|account$/i.test(String(c)))&&r.some(c=>/amount/i.test(String(c)))&&r.some(c=>/date/i.test(String(c)))); if(hi>=0&&(!best||aoa.length>best.aoa.length)) best={aoa,hi}; });
  if(!best) throw new Error('no sheet with Date / Acct / Amount / Partner columns');
  const cols=best.aoa[best.hi].map(c=>String(c).toLowerCase()); const ci=re=>cols.findIndex(c=>re.test(c));
  const cD=ci(/date/), cA=ci(/^acct|^account$|acct #|account number/), cN=ci(/account name/), cAmt=ci(/^amount/), cP=ci(/partner|payee|vendor|customer/), cT=ci(/^type/);
  const accts={}, parts={}; const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(let i=best.hi+1;i<best.aoa.length;i++){ const r=best.aoa[i]; const a=String(r[cA]||'').trim(); if(!/^\d{4}$/.test(a)) continue; let d=r[cD]; if(typeof d==='number') d=new Date(Math.round((d-25569)*86400*1000)); else d=new Date(d); if(isNaN(d)) continue; const mi=d.getMonth(); const amt=num(r[cAmt]); const nm=cN>=0?String(r[cN]):''; const tp=cT>=0?String(r[cT]):(a[0]==='4'?'Revenue':a[0]==='5'?'COGS':/^[67]/.test(a)?'Expense':a[0]==='1'?'Asset':a[0]==='2'?'Liability':'Other'); const p=cP>=0?String(r[cP]||'Unknown').trim():'Unknown';
    accts[a]=accts[a]||{acct:a,name:nm,type:tp,m:Array(12).fill(0)}; accts[a].m[mi]+=amt; const k=a+'|'+p; parts[k]=parts[k]||{acct:a,partner:p,m:Array(12).fill(0),total:0}; parts[k].m[mi]+=amt; parts[k].total+=amt; }
  return {period:'uploaded ledger',source:'Uploaded classified ledger (cash basis)',months,accounts:Object.values(accts).map(a=>({...a,m:a.m.map(Math.round)})),partners:Object.values(parts).filter(x=>Math.abs(x.total)>=1000||x.acct[0]==='4').map(x=>({...x,m:x.m.map(Math.round),total:Math.round(x.total)}))};
}

/* ===================== IMPORT / EXPORT / BRAND ===================== */
const dlg=$('#dlg');
$('#btnImport').onclick=()=>{$('#dlgTitle').textContent='Upload / import';$('#dlgHint').textContent='Two ways: (1) a location JSON from Export — paste it or choose the .json file; (2) a CSV or Excel file with your costs, customers/SKUs, lines and headcount — the app reads every sheet, classifies each row (facility cost, service, department, line, customer/SKU) and shows you the result before adding it. Columns it understands: name/item/description, amount/cost/monthly, vendor, frequency, customer, sku/product, line, bpm/speed, fee/price, units/volume, heads/headcount, wage/rate, hours, shifts, crew, oee.';$('#dlgText').value='';$('#dlgText').hidden=false;$('#dlgPreview').hidden=true;$('#dlgPreview').innerHTML='';pendingRows=null;$('#dlgFile').hidden=false;$('#dlgFile').value='';$('#dlgApply').hidden=false;$('#dlgApplyNew').hidden=false;$('#dlgCopy').hidden=true;dlg.showModal();};
$('#dlgClose').onclick=()=>{pendingRows=null;dlg.close();};
$('#dlgCopy').onclick=()=>{const t=$('#dlgText');navigator.clipboard.writeText(t.value).then(()=>toast('Copied')).catch(()=>{t.select();toast('Select and copy manually');});};
$('#dlgFile').onchange=e=>{const f=e.target.files[0];if(!f)return; if(/\.json$/i.test(f.name)){const rd=new FileReader();rd.onload=()=>{$('#dlgText').value=rd.result;$('#dlgText').hidden=false;$('#dlgPreview').hidden=true;pendingRows=null;};rd.readAsText(f);} else { const rd=new FileReader(); rd.onload=()=>{ try{ classifyUpload(rd.result,f.name); }catch(err){ $('#dlgHint').textContent='Could not read that file: '+err.message; } }; rd.readAsArrayBuffer(f);} };
function parseImport(){ const p=JSON.parse($('#dlgText').value); if(!p.f||!Array.isArray(p.lines)||!Array.isArray(p.skus)||!Array.isArray(p.depts)) throw new Error('missing f / lines / skus / depts'); const base=blankLocation(p.name||'Imported'); p.f={...base.f,...p.f}; p.growth={...base.growth,...(p.growth||{})}; p.site=p.site||base.site; p.services=p.services||[]; p.est=p.est||{}; p.company=p.company||''; p.skus.forEach(k=>{k.mat=k.mat||{bottle:0,cap:0,label:0,case:0,ingredient:0,other:0};k.mode=k.mode||'units';k.model=k.model||'tolling';k.line=k.line|0;}); p.depts.forEach(d=>{d.agency=d.agency||0;}); return ensureDefaults(p); }
$('#dlgApply').onclick=()=>{ if(pendingRows){ applyClassified(false); return; } try{state.scenarios[state.active]=parseImport();save();dlg.close();rerender(true);toast('Location replaced');}catch(err){$('#dlgHint').textContent='Could not read that JSON: '+err.message;}};
$('#dlgApplyNew').onclick=()=>{ if(pendingRows){ applyClassified(true); return; } try{state.scenarios.push(parseImport());state.active=state.scenarios.length-1;state.compare=false;save();dlg.close();rerender(true);toast('Location added');}catch(err){$('#dlgHint').textContent='Could not read that JSON: '+err.message;}};
$('#btnReset').onclick=()=>{const b=$('#btnReset'); if(b.dataset.arm){ state={active:0,compare:false,cmpA:0,cmpB:1,module:'econ',tab:'pl',vtab:'ebitda',dtab:'overview',scenarios:[newSiteLean('Zen Bottling')]}; save(); delete b.dataset.arm; b.textContent='Reset data'; rerender(true); toast('Zen Bottling seed restored'); } else { b.dataset.arm='1'; b.textContent='Click again to reset ALL locations'; setTimeout(()=>{delete b.dataset.arm;b.textContent='Reset data';},3000);} };
$('#btnCompare').onclick=()=>{state.compare=!state.compare;save();renderScenTabs();renderMain();};
function renderBrand(){const s=S();const h=$('#hdrCompany');if(document.activeElement!==h)h.value=s.company||'';const nm=(s.company||'').trim();$('#footCompany').textContent=nm||s.name;$('#brandMark').textContent=nm?nm[0].toUpperCase():'·';}
$('#hdrCompany').addEventListener('input',e=>{S().company=e.target.value;save();renderBrand();const rc=$('#s-company');if(rc)rc.value=e.target.value;});
function rerender(rail){renderScenTabs();if(rail)renderRail();renderMain();renderBrand();}
setUnlocked(isUnlocked()); rerender(true);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renderMain());
